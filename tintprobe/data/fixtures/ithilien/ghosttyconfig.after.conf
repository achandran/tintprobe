# ghostty config
# ~/.config/ghostty/config

# use p3 colorspace over srgb
window-colorspace = display-p3

# start fullscreen
fullscreen = true
# This is my all new comment

# font
font-family = Berkeley Mono
font-size = 15
font-style-bold = false
font-style-bold-italic = fase
window-title-font-family = Berkeley Mono

theme = jellybeans_warm.conf

keybind = shift+enter=text:\n
