name = "tintprobe"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "coloraide" },
    { name = "pillow" },
    { name = "pynvim" },
]

[package.dev-dependencies]
dev = [
    { name = "basedpyright" },
    { name = "debugpy" },
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "coloraide", specifier = ">=8.10,<9" },
    { name = "pillow", specifier = ">=11,<13" },
    { name = "pynvim", specifier = ">=0.6.0" },
]

[package.metadata.requires-dev]
dev = [
    { name = "basedpyright", specifier = "==1.40.1" },
    { name = "debugpy", specifier = "==1.8.21" },
    { name = "pytest", specifier = "==9.1.1" },
]
